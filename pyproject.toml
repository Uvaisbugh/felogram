[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "felogram"
version = "0.1.0"
description = "A Python desktop Telegram client powered by TDLib"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.2",
    "tdjson==1.8.67",
]

[project.scripts]
felogram = "felogram.main:main"
felogram-probe = "felogram.probe:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.9",
]
package = [
    "pyinstaller==6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/felogram"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["felogram"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tdjson"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["native: exercises the installed TDLib native binding"]
